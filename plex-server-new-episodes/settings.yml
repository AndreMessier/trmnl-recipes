name: 'Plex Server New Episodes'
no_screen_padding: 'no'
dark_mode: 'no'
strategy: polling
polling_verb: get
polling_url: '{{ server_url }}/library/sections/{{ tv_section_id }}/recentlyAdded'
polling_headers: 'X-Plex-Token= {{ plex_token }}'
refresh_interval: 60
id: null
custom_fields:
  -
    keyname: server_url
    field_type: string
    name: 'Plex Server URL'
    description: 'e.g. http://192.168.1.100:32400 (local network address of your Plex Media Server)'
  -
    keyname: plex_token
    field_type: string
    name: 'Plex Token'
  -
    keyname: tv_section_id
    field_type: string
    name: 'TV Shows Library Section ID'
    description: 'Check /library/sections on your server to find this (varies per server)'
  -
    keyname: item_count
    field_type: number
    name: 'Shows to show'
    default: 5
  -
    keyname: title_text
    field_type: string
    name: 'Title text'
    description: 'Text shown in the title bar. Customize this to identify whose server this is if you run more than one.'
    default: 'New Episodes'
